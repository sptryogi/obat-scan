[project]
name = "obat-scan"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "opencv-python-headless>=4.8",
  "flask>=3.0",
  "rapidocr-onnxruntime>=1.3",
  "zxing-cpp",
  "psycopg[binary]>=3.1",
]

[tool.uv]
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.vercel]
entrypoint = "api.index:app"